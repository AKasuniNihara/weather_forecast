spring.application.name=weather-forecast
server.port=8080

# Logging config
logging.level.root=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger : %msg%n
logging.file.name=logs/app.log

spring.cloud.config.enabled=false


# Cache settings (5-minute TTL)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=300s

# OpenWeatherMap API Key
openweather.base.url=https://api.openweathermap.org/data/2.5
